<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Website Editor · Ana Vilhete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Editor: the site's own stone + ink palette, raspberry kept for the one action that matters (Publish). */
:root{
  --bg:#EDE9E3; --panel:#F7F5F1; --card:#FFFFFF; --sunk:#E4DFD7;
  --ink:#1C1815; --muted:#6B625A; --faint:#958B81;
  --line:rgba(28,24,21,.11); --line-2:rgba(28,24,21,.22);
  --accent:#A8215A; --accent-ink:#FFFFFF; --accent-soft:rgba(168,33,90,.09);
  --nude:#D8BCA6; --nude-soft:#F1E6DC; --nude-ink:#6E4A35;
  --ok:#2F7D4F; --warn:#9A5B00; --err:#B42318;
  --shadow:0 1px 2px rgba(28,24,21,.06),0 8px 24px -12px rgba(28,24,21,.18);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-ui:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-sm:8px;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151210; --panel:#1C1916; --card:#24201C; --sunk:#100E0C;
  --ink:#EFE9E1; --muted:#A99F94; --faint:#857B71;
  --line:rgba(239,233,225,.10); --line-2:rgba(239,233,225,.2);
  --accent:#D9558C; --accent-ink:#1A0B11; --accent-soft:rgba(217,85,140,.14);
  --nude:#7A5A46; --nude-soft:#2E241D; --nude-ink:#E7C9B3;
  --ok:#5FBF86; --warn:#E0A54A; --err:#F2726A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151210; --panel:#1C1916; --card:#24201C; --sunk:#100E0C;
  --ink:#EFE9E1; --muted:#A99F94; --faint:#857B71;
  --line:rgba(239,233,225,.10); --line-2:rgba(239,233,225,.2);
  --accent:#D9558C; --accent-ink:#1A0B11; --accent-soft:rgba(217,85,140,.14);
  --nude:#7A5A46; --nude-soft:#2E241D; --nude-ink:#E7C9B3;
  --ok:#5FBF86; --warn:#E0A54A; --err:#F2726A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;font-weight:400}

/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .2s,border-color .2s,opacity .2s}
.b:hover{border-color:var(--ink)}
.b:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line-2)}
.b--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b--primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.b--ghost{background:transparent;border-color:transparent}
.b--ghost:hover{background:var(--sunk);border-color:transparent}
.b--danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:transparent}
.b--danger:hover{background:color-mix(in srgb,var(--err) 10%,transparent);border-color:var(--err)}
.b--sm{min-height:32px;padding:0 12px;font-size:13px}
.icon-b{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px}
.icon-b:hover{background:var(--sunk);color:var(--ink)}
.icon-b:disabled{opacity:.3;cursor:default;background:transparent}

/* ===== sign-in ===== */
.signin{min-height:100%;display:grid;grid-template-columns:1fr}
.si-art{position:relative;min-height:220px;background:#B4AC9F;overflow:hidden}
.si-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.si-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,14,0) 40%,rgba(18,16,14,.65))}
.si-art .cap{position:absolute;z-index:1;left:var(--gl);bottom:22px;color:#F3EEE7}
.si-art .cap b{display:block;font:400 clamp(34px,5vw,56px)/1 var(--f-display);letter-spacing:-.02em}
.si-art .cap span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.si-form{padding:clamp(28px,6vw,72px) var(--gr) 40px var(--gl);display:grid;align-content:center;gap:22px;max-width:560px;width:100%;margin:0 auto}
.si-form h1{font:400 clamp(32px,4vw,44px)/1.05 var(--f-display);letter-spacing:-.02em}
.si-form h1 em{font-style:italic;color:var(--accent)}
.si-form p{margin:0}
@media(min-width:900px){.signin{grid-template-columns:5fr 6fr}.si-art{min-height:100vh}}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--muted)}
.steps b{color:var(--ink);font-weight:600}
details.help{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 16px}
details.help summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.help summary::after{content:"+";font-weight:400;color:var(--muted)}
details.help[open] summary::after{content:"–"}
details.help>div{padding:0 0 16px;display:grid;gap:12px}
.err-box{border:1px solid color-mix(in srgb,var(--err) 40%,transparent);background:color-mix(in srgb,var(--err) 8%,transparent);color:var(--ink);padding:12px 14px;border-radius:var(--r-sm);font-size:14px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.linkish:hover{color:var(--ink)}

/* ===== fields ===== */
.f{display:grid;gap:6px;min-width:0}
.f>*,.main-in>*,.list>*,.card-b>*{min-width:0}
.f>label,.f .lbl{font-weight:600;font-size:14px}
.f .hint{font-size:13px;color:var(--muted);margin:0}
.f .hint code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.in{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);transition:border-color .15s,box-shadow .15s}
.in:hover{border-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:84px;line-height:1.5;overflow:hidden}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.in.bad{border-color:var(--err)}
.f .bad-msg{font-size:13px;color:var(--err)}
.f .count{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.f .count.over{color:var(--warn)}
.rich-pv{font-family:var(--f-display);font-size:19px;line-height:1.25;color:var(--muted);padding:2px 0 0;overflow-wrap:anywhere}
.rich-pv::before{content:"Shows as  ";font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.rich-pv em{color:var(--ink)}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:40px;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.sw .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+.track{background:var(--ok)}
.sw input:checked+.track::after{transform:translateX(16px)}
.sw input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.sw .sw-t{font-weight:600;font-size:14px}
.sw .sw-t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
fieldset.grp{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0;display:grid;gap:18px;background:var(--panel)}
fieldset.grp legend{padding:0 6px;font-weight:600}

/* photo field */
.ph-f{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card)}
.ph-f .th{width:56px;height:70px;border-radius:6px;background:var(--sunk);overflow:hidden;flex:none}
.ph-f .th img{width:100%;height:100%;object-fit:cover;display:block}
.ph-f .nm{flex:1;min-width:0;font-size:14px}
.ph-f .nm small{display:block;color:var(--muted);font-size:12.5px}
.ph-f .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* lists */
.list{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.card.is-hidden{opacity:.62}
.card-h{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px}
.card-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;cursor:pointer;padding:10px 8px;border-radius:8px}
.card-t:hover{background:var(--panel)}
.card-t .no{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);flex:none}
.card-t .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.card-t .chev{margin-left:auto;color:var(--faint);transition:transform .2s;flex:none}
.card[data-open] .card-t .chev{transform:rotate(90deg)}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);flex:none}
.card-b{padding:6px 16px 18px;display:grid;gap:18px;border-top:1px solid var(--line)}
.card-acts{display:flex;align-items:center}
.confirm-del{display:flex;align-items:center;gap:8px;padding:8px 12px;background:color-mix(in srgb,var(--err) 7%,transparent);border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.confirm-del span{flex:1;min-width:160px}
.add{justify-self:start}
.list .list .card{box-shadow:none;background:var(--panel)}

/* ===== app shell ===== */
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px var(--gr) 10px var(--gl);padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none}
.brand b{font:400 22px/1 var(--f-display)}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.status.dirty i{background:var(--warn)}
.status.demo i{background:var(--nude)}
.status.busy i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.top .sp{flex:1}
.top .acts{display:flex;gap:8px;align-items:center}
.acct{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:grid;z-index:20}
.menu .mi{display:block;text-align:left;padding:10px 12px;border-radius:8px;background:none;border:0;cursor:pointer;font-size:14px;text-decoration:none}
.menu .mi:hover{background:var(--panel)}
.menu .meta{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

.body{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.body>*{min-width:0}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 10px 24px}
.side h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.nav-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:0;background:none;cursor:pointer;font-size:14.5px;color:var(--ink)}
.nav-i:hover{background:var(--sunk)}
.nav-i[aria-current="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.nav-i .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:auto;flex:none}
.nav-i .off{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-left:auto}
.main{overflow:auto;min-width:0}
.main-in{max-width:680px;margin:0 auto;padding:28px var(--gr) 120px var(--gl);display:grid;gap:22px}
.sec-h{display:grid;gap:8px;padding-bottom:6px}
.sec-h .mono{color:var(--accent)}
.sec-h h1{font:400 clamp(30px,3.4vw,40px)/1.05 var(--f-display);letter-spacing:-.02em}
.sec-h p{margin:0;color:var(--muted);max-width:60ch}
.banner{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--nude-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--nude) 60%,transparent);font-size:14px}
.banner p{margin:0;flex:1;min-width:220px}
.banner .bacts{display:flex;gap:8px;flex-wrap:wrap}
.show-row{padding:4px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}

.pv{display:none;min-width:0;background:var(--sunk);border-left:1px solid var(--line);grid-template-rows:auto 1fr;min-height:0}
.pv-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.pv-bar .mono{color:var(--muted);margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:99px;padding:2px;background:var(--card)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pv-stage{position:relative;overflow:hidden;min-height:0}
.pv-frame{position:absolute;top:0;left:0;border:0;background:#ECE8E2;transform-origin:0 0}
.pv-stage.phone .pv-frame{border-radius:28px;box-shadow:0 0 0 8px #1C1815,0 30px 60px -20px rgba(0,0,0,.5)}
.pv-close{display:none}

@media(min-width:760px){.body{grid-template-columns:230px minmax(0,1fr)}}
@media(max-width:759px){
  .pv-bar .mono{display:none}
  .pv-bar .seg{margin-right:auto}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:8px var(--gr) 8px var(--gl);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side h2{display:none}
  .nav-i{width:auto;white-space:nowrap;flex:none;padding:8px 12px}
  .nav-i .dot{margin-left:4px}.nav-i .off{display:none}
  .body{grid-template-rows:auto minmax(0,1fr)}
  .brand span,.status .st-long{display:none}
  .top .acts{width:100%;justify-content:flex-end;gap:6px}
  .top .acts .b{flex:1 1 auto;padding:0 10px;min-width:0}
  .top .acct{flex:none}
}
@media(min-width:1180px){
  .body.with-pv{grid-template-columns:220px minmax(440px,600px) minmax(0,1fr)}
  .body.with-pv .pv{display:grid}
  .body.with-pv .main-in{padding-inline:28px}
  .pv-open-b{display:none}
}
.pv.overlay{display:grid;position:fixed;inset:0;z-index:40;border:0}
.pv.overlay .pv-close{display:inline-flex}

/* photos library */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ph-card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;display:grid;box-shadow:var(--shadow);min-width:0}
.ph-card .im{aspect-ratio:4/5;background:var(--sunk);position:relative}
.ph-card .im img{width:100%;height:100%;object-fit:cover;display:block}
.ph-card .im .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:13px}
.ph-card .bd{padding:12px;display:grid;gap:10px}
.ph-card .use{font-size:12.5px;color:var(--muted)}
.ph-card .use b{color:var(--ink);font-weight:600}
.ph-card .row{display:flex;gap:6px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);display:grid;place-items:center;text-align:center;padding:24px;min-height:200px;cursor:pointer;color:var(--muted);background:var(--panel)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* history */
.hist{display:grid;gap:8px}
.h-item{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);flex-wrap:wrap}
.h-item .when{font-variant-numeric:tabular-nums;min-width:150px;font-weight:600;font-size:14px}
.h-item .what{flex:1;min-width:180px;font-size:14px}
.h-item .what small{display:block;color:var(--muted)}

/* dialogs + toasts */
dialog.dlg{border:0;padding:0;border-radius:16px;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog.dlg::backdrop{background:rgba(20,16,13,.5)}
.dlg-in{padding:24px;display:grid;gap:16px}
.dlg-in h2{font:400 28px/1.1 var(--f-display);letter-spacing:-.01em}
.dlg-in p{margin:0}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
.dlg-list{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.warn-list{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:var(--r-sm);padding:10px 14px;font-size:14px}
.warn-list ul{margin:6px 0 0;padding-left:18px}
dialog.picker{width:min(860px,calc(100vw - 32px))}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:min(60vh,560px);overflow:auto;padding:2px}
.pick{border:2px solid transparent;border-radius:10px;background:var(--panel);padding:0;cursor:pointer;overflow:hidden;text-align:left;display:grid}
.pick img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.pick span{padding:6px 8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick[aria-pressed="true"]{border-color:var(--accent)}
.pick.none,.pick.up{display:grid;place-items:center;aspect-ratio:4/5.6;color:var(--muted);font-size:13px;text-align:center;padding:10px;border:1.5px dashed var(--line-2)}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;width:min(480px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:tin .3s ease-out}
.toast.err{background:var(--err);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.loading{height:100%;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted)}
.loading b{font:400 44px/1 var(--f-display);color:var(--ink)}
.spin{width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"><div class="loading"><b>AV</b><span>Opening the editor…</span></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="dlg" id="dlg"><div class="dlg-in" id="dlgIn"></div></dialog>
<dialog class="dlg picker" id="picker"><div class="dlg-in" id="pickIn"></div></dialog>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
/* =====================================================================
   Website editor for anavilhete.com
   Content lives in content.json in the GitHub repository. This page reads
   it, lets Ana edit it with forms, and publishes it back with one commit
   (content.json + index.html). Photos are uploaded to images/ on choose.
   ===================================================================== */
const CONFIG = {
  owner: "anavilhete-empoweringwomen",   // GitHub account that holds the website
  repo: "Ana.Vilhete",                    // repository name
  branch: ""                              // blank = the repository's default branch
};

const ON_SITE = /\/admin(\/|\/index\.html)?$/.test(location.pathname);
const SITE_BASE = ON_SITE ? "../" : "";
const SITE_PAGE = ON_SITE ? "../index.html" : "site.html";
const ICON = {
  eye: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  up: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  trash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
};
const ORIGIN = location.origin === "null" ? "*" : location.origin;
const ITALIC = "Put *asterisks* around words to set them in italics.";

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rich = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const plain = s => String(s ?? "").replace(/\*/g, "");
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const getP = (o, p) => p.reduce((a, k) => (a == null ? undefined : a[k]), o);
const setP = (o, p, v) => { let a = o; for (let i = 0; i < p.length - 1; i++) { if (a[p[i]] == null) a[p[i]] = typeof p[i + 1] === "number" ? [] : {}; a = a[p[i]]; } a[p[p.length - 1]] = v; };
const keyOf = p => p.join(".");
const store = {
  get(k, session) { try { return JSON.parse((session ? sessionStorage : localStorage).getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v, session) { try { (session ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};
const b64ToText = b64 => new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g, "")), c => c.charCodeAt(0)));
const bytesToB64 = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const fmtDate = d => new Date(d).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => c != null && c !== false && el.append(c.nodeType ? c : document.createTextNode(c)));
  return el;
}
function toast(msg, err) {
  const t = h("div", { class: "toast" + (err ? " err" : "") }, msg);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), err ? 7000 : 4200);
}
function ask({ title, text, ok = "OK", cancel = "Cancel", danger = false }) {
  return new Promise(res => {
    const d = $("#dlg"), inn = $("#dlgIn");
    inn.innerHTML = "";
    const done = v => { d.close(); res(v); };
    inn.append(h("h2", {}, title), h("p", { html: text }),
      h("div", { class: "dlg-acts" },
        cancel ? h("button", { class: "b", onclick: () => done(false) }, cancel) : null,
        h("button", { class: "b " + (danger ? "b--danger" : "b--primary"), onclick: () => done(true) }, ok)));
    d.onclose = () => res(false);
    d.showModal();
  });
}

/* ---------------- state ---------------- */
const S = {
  mode: null,           // "live" | "demo"
  token: "", owner: CONFIG.owner, repo: CONFIG.repo, branch: CONFIG.branch,
  published: null, baseSha: null, draft: null,
  section: "site", open: new Set(), pending: {}, device: "desktop",
  restoredFrom: null, versionNote: null, lastPublished: null
};
const draftKey = () => `av-editor-draft:${S.owner}/${S.repo}`;

/* ---------------- GitHub ---------------- */
async function gh(path, opts = {}) {
  const base = `https://api.github.com/repos/${S.owner}/${S.repo}`;
  const res = await fetch(path ? `${base}/${path}` : base, {
    method: opts.method || "GET",
    cache: "no-store",
    headers: Object.assign({ Authorization: `Bearer ${S.token}`, Accept: "application/vnd.github+json" }, opts.body ? { "Content-Type": "application/json" } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) {
    let m = ""; try { m = (await res.json()).message || ""; } catch (e) {}
    const e = new Error(m || res.statusText); e.status = res.status; throw e;
  }
  return res.status === 204 ? null : res.json();
}
function explain(e) {
  if (e && e.status === 401) return "This access key isn’t valid or has expired. Sign out, then sign in with a new key.";
  if (e && e.status === 403) return "This access key isn’t allowed to save. In GitHub, give the key “Contents: Read and write” access to the website repository.";
  if (e && e.status === 404) return "GitHub couldn’t find the website with this key. Check the key has access to the repository " + S.owner + "/" + S.repo + ".";
  if (e && (e.status === 409 || e.status === 422)) return "The website changed on GitHub while you were saving. Try publishing again.";
  if (e instanceof TypeError) return "Couldn’t reach GitHub. Check your internet connection and try again.";
  return (e && e.message) || "Something went wrong.";
}
async function loadLive() {
  const info = await gh("");
  if (!S.branch) S.branch = info.default_branch || "main";
  try {
    const f = await gh(`contents/content.json?ref=${encodeURIComponent(S.branch)}`);
    S.baseSha = f.sha; S.published = JSON.parse(b64ToText(f.content));
  } catch (e) {
    if (e.status !== 404) throw e;
    const idx = await gh(`contents/index.html?ref=${encodeURIComponent(S.branch)}`);
    const m = b64ToText(idx.content).match(/<script type="application\/json" id="site-content">([\s\S]*?)<\/script>/);
    if (!m) { const er = new Error("The website on GitHub isn’t the editable version yet. Upload the new site files (index.html, content.json, images and admin) first."); throw er; }
    S.published = JSON.parse(m[1]); S.baseSha = null;
  }
}
async function loadDemo() {
  const r = await fetch(SITE_BASE + "content.json", { cache: "no-store" });
  if (!r.ok) throw new Error("Couldn’t load the website content.");
  S.published = await r.json(); S.baseSha = null;
}

/* ---------------- publishing ---------------- */
const safeJson = c => JSON.stringify(c).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
const attr = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
function buildSeo(c) {
  const s = c.site, url = s.url || "/";
  const hero = (c.photos || []).find(p => p.id === c.hero.photo);
  const img = hero ? url.replace(/\/+$/, "") + "/" + hero.src : "";
  const t = attr(s.title || s.name), d = attr(s.description);
  return [`<title>${t}</title>`, `<meta name="description" content="${d}">`, `<meta property="og:title" content="${t}">`,
    `<meta property="og:description" content="${d}">`, `<meta property="og:type" content="profile">`, `<meta property="og:url" content="${attr(url)}">`]
    .concat(img ? [`<meta property="og:image" content="${attr(img)}">`] : [])
    .concat([`<meta name="twitter:card" content="summary_large_image">`, `<link rel="canonical" href="${attr(url)}">`]).join("\n");
}
function applyToHtml(html, c) {
  const reSeo = /<!--SEO:START-->[\s\S]*?<!--SEO:END-->/;
  const reData = /(<script type="application\/json" id="site-content">)[\s\S]*?(<\/script>)/;
  if (!reSeo.test(html) || !reData.test(html)) throw new Error("The website’s index.html is missing the editor markers. Upload the new index.html from the setup files, then publish again.");
  return html.replace(reSeo, () => `<!--SEO:START-->\n${buildSeo(c)}\n<!--SEO:END-->`)
             .replace(reData, (m, a, b) => a + safeJson(c) + b);
}
function cleanContent(c) {
  const walk = v => {
    if (Array.isArray(v)) {
      const isStr = v.every(x => typeof x === "string");
      return isStr ? v.map(x => x.trim()).filter(Boolean) : v.map(walk);
    }
    if (v && typeof v === "object") { const o = {}; for (const k in v) o[k] = walk(v[k]); return o; }
    return typeof v === "string" ? v.replace(/\s+$/, "") : v;
  };
  return walk(c);
}
async function publishLive(note, force) {
  const content = cleanContent(S.draft);
  const ref = await gh(`git/ref/heads/${encodeURIComponent(S.branch)}`);
  const headSha = ref.object.sha;
  const head = await gh(`git/commits/${headSha}`);
  const tree = await gh(`git/trees/${head.tree.sha}`);
  const cur = tree.tree.find(e => e.path === "content.json");
  if (!force && cur && S.baseSha && cur.sha !== S.baseSha) return { conflict: true };
  const idx = await gh(`contents/index.html?ref=${headSha}`);
  const html = applyToHtml(b64ToText(idx.content), content);
  const json = JSON.stringify(content, null, 2) + "\n";
  const nt = await gh("git/trees", { method: "POST", body: { base_tree: head.tree.sha, tree: [
    { path: "content.json", mode: "100644", type: "blob", content: json },
    { path: "index.html", mode: "100644", type: "blob", content: html }] } });
  const commit = await gh("git/commits", { method: "POST", body: { message: note || "Update website content", tree: nt.sha, parents: [headSha] } });
  await gh(`git/refs/heads/${encodeURIComponent(S.branch)}`, { method: "PATCH", body: { sha: commit.sha } });
  const ent = nt.tree.find(e => e.path === "content.json");
  return { ok: true, sha: ent ? ent.sha : null, content };
}

/* ---------------- photos ---------------- */
async function processImage(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("This file isn’t a photo the browser can read. Try a JPG or PNG.")); i.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, max = 1800, k = Math.min(1, max / Math.max(w0, h0));
  const w = Math.round(w0 * k), hgt = Math.round(h0 * k);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = hgt;
  const cx = cv.getContext("2d"); cx.imageSmoothingQuality = "high"; cx.drawImage(src, 0, 0, w, hgt);
  let blob = await new Promise(r => cv.toBlob(r, "image/webp", 0.82));
  let ext = "webp";
  if (!blob || blob.type !== "image/webp") { blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.86)); ext = "jpg"; }
  return { blob, w, h: hgt, ext };
}
const slug = s => String(s || "photo").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\.[a-z0-9]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "photo";
const prettyName = s => { const b = String(s || "").replace(/\.[a-z0-9]+$/i, "").replace(/[-_]+/g, " ").trim(); return b ? b[0].toUpperCase() + b.slice(1) : "New photo"; };
async function uploadPhoto(file) {
  const img = await processImage(file);
  const name = `${slug(file.name)}-${Date.now().toString(36)}.${img.ext}`;
  const path = `images/${name}`;
  if (S.mode === "live") {
    const b64 = bytesToB64(new Uint8Array(await img.blob.arrayBuffer()));
    await gh(`contents/${path}`, { method: "PUT", body: { message: `Add photo ${name}`, content: b64, branch: S.branch } });
  }
  S.pending[path] = URL.createObjectURL(img.blob);
  return { src: path, w: img.w, h: img.h };
}
function thumb(p) {
  if (!p) return "";
  return S.pending[p.src] || SITE_BASE + p.src;
}
function rawUrl(src) { return `https://raw.githubusercontent.com/${S.owner}/${S.repo}/${S.branch || "main"}/${src}`; }
function imgEl(p, extra = {}) {
  const i = h("img", Object.assign({ src: thumb(p), alt: "", loading: "lazy" }, extra));
  if (S.mode === "live") i.addEventListener("error", function once() { i.removeEventListener("error", once); i.src = rawUrl(p.src); });
  return i;
}
function photoUses(id, c = S.draft) {
  const out = [];
  const walk = (v, path) => {
    if (Array.isArray(v)) v.forEach((x, i) => walk(x, path.concat(i)));
    else if (v && typeof v === "object") for (const k in v) { if (k === "photo" && v[k] === id) out.push(path); else walk(v[k], path.concat(k)); }
  };
  walk(c, []);
  return out.map(p => {
    const sec = SECTIONS.find(s => (s.roots || [s.id]).includes(p[0]));
    const idx = p.find(x => typeof x === "number");
    return (sec ? sec.title : p[0]) + (idx != null ? ` · item ${idx + 1}` : p[1] === "feature" ? " · featured quote" : "");
  });
}
let pickResolve = null;
function pickPhoto(current, allowNone) {
  return new Promise(res => {
    pickResolve = res;
    const d = $("#picker"), inn = $("#pickIn");
    const draw = () => {
      inn.innerHTML = "";
      const grid = h("div", { class: "pick-grid" });
      grid.append(h("button", { class: "pick up", onclick: () => chooseFile(async f => { await addPhotos([f]); draw(); }) }, h("span", {}, "+ Upload a new photo")));
      if (allowNone) grid.append(h("button", { class: "pick none", "aria-pressed": !current ? "true" : "false", onclick: () => { d.close(); res(""); } }, "No photo"));
      (S.draft.photos || []).forEach(p => grid.append(h("button", { class: "pick", "aria-pressed": p.id === current ? "true" : "false", title: p.name, onclick: () => { d.close(); res(p.id); } }, imgEl(p), h("span", {}, p.name || p.id))));
      inn.append(h("h2", {}, "Choose a photo"), grid, h("div", { class: "dlg-acts" }, h("button", { class: "b", onclick: () => { d.close(); res(null); } }, "Cancel")));
    };
    draw();
    d.onclose = () => { if (pickResolve === res) res(null); };
    d.showModal();
  });
}
function chooseFile(cb, multiple) {
  const fi = $("#fileIn");
  fi.multiple = !!multiple; fi.value = "";
  fi.onchange = () => { const files = [...fi.files]; if (files.length) cb(multiple ? files : files[0]); };
  fi.click();
}
let uploading = 0;
async function addPhotos(files) {
  const added = [];
  for (const f of files) {
    uploading++; setStatus();
    try {
      const up = await uploadPhoto(f);
      let base = slug(f.name), id = base, n = 2;
      while (S.draft.photos.some(p => p.id === id)) id = `${base}-${n++}`;
      const p = { id, name: prettyName(f.name), src: up.src, w: up.w, h: up.h, alt: "" };
      S.draft.photos.push(p); added.push(p);
      toast(S.mode === "live" ? `Uploaded “${p.name}”. Add a short description, then publish to use it on the site.` : `Added “${p.name}” (demo — not uploaded).`);
    } catch (e) { toast(`Couldn’t add ${f.name}: ${explain(e)}`, true); }
    uploading--; setStatus();
  }
  changed(true);
  return added;
}

/* ---------------- schema: what can be edited ---------------- */
const SECTIONS = [
  { id: "site", roots: ["site", "social"], title: "Site details", anchor: "top", intro: "Your name, how the site appears in Google and in shared links, and your social profiles.", fields: [
    { k: "site.name", t: "text", label: "Name", help: "Used in the logo, the footer and the signature." },
    { k: "site.initials", t: "text", label: "Initials", help: "The small logo in the corner and on the loading screen." },
    { k: "site.title", t: "text", label: "Page title", help: "Shown on the browser tab and as the headline in Google results." },
    { k: "site.description", t: "area", label: "Description for Google and shared links", counter: 160, help: "Shown under the title in Google, and in previews when the link is shared on WhatsApp or LinkedIn. About 150 characters is ideal." },
    { k: "site.locations", t: "text", label: "Locations line", help: "The small text in the bottom corner of the opening screen." },
    { k: "social", t: "list", label: "Social links", noun: "link", title: i => i.label || "New link", add: () => ({ label: "", url: "" }), fields: [
      { k: "label", t: "text", label: "Name shown", help: "For example: Instagram" }, { k: "url", t: "url", label: "Link" }] },
    { k: "site.url", t: "url", label: "Website address", help: "Only change this if the website moves to a new domain." }
  ] },
  { id: "hero", title: "Opening screen", anchor: "top", intro: "The first screen visitors see: your name, your line and the large portrait.", fields: [
    { k: "hero.roles", t: "lines", label: "Roles above your name", help: "One per line." },
    { k: "hero.firstName", t: "text", label: "Name, first line" },
    { k: "hero.lastName", t: "text", label: "Name, second line", help: "This line is set in italics on the site." },
    { k: "hero.quote", t: "rich", label: "Your line", help: "Quotation marks are added for you. " + ITALIC },
    { k: "hero.intro", t: "area", label: "Short introduction" },
    { k: "hero.photo", t: "photo", label: "Large portrait", help: "A full-length photo on a plain background works best." },
    { k: "hero.primaryCta", t: "text", label: "Main button", help: "Goes to the contact section. Also used in the top menu." },
    { k: "hero.secondaryCta", t: "text", label: "Second button", help: "Goes to the press section." },
    { k: "hero.marquee", t: "lines", label: "Scrolling words under the opening screen", help: "One per line. Every other word is drawn in outline." }
  ] },
  { id: "about", title: "About", anchor: "about", intro: "A short introduction to who you are, with key facts.", fields: [
    { k: "about.show", t: "show" },
    { k: "about.label", t: "text", label: "Small label", help: "The small text next to the section number." },
    { k: "about.heading", t: "rich", label: "Heading", help: ITALIC },
    { k: "about.lede", t: "area", label: "Opening paragraph", help: "Shown larger, with a drop capital." },
    { k: "about.body", t: "area", label: "More text", help: "Leave an empty line between paragraphs." },
    { k: "about.facts", t: "list", label: "Key facts", noun: "fact", title: i => [i.value, i.label].filter(Boolean).join(" — ") || "New fact", add: () => ({ value: "", label: "" }), fields: [
      { k: "value", t: "text", label: "Number or year", help: "Plain numbers (like 3 or 10.4M) count up when they appear." }, { k: "label", t: "text", label: "What it means" }] },
    { k: "about.photo", t: "photo", label: "Photo", allowNone: true },
    { k: "about.caption", t: "text", label: "Photo caption" },
    { k: "about.button", t: "text", label: "Button", help: "Goes to the Story section." }
  ] },
  { id: "work", title: "What I do", anchor: "work", intro: "The areas of your work, one line each.", fields: [
    { k: "work.show", t: "show" },
    { k: "work.label", t: "text", label: "Small label" },
    { k: "work.heading", t: "rich", label: "Heading", help: ITALIC },
    { k: "work.items", t: "list", label: "Areas", noun: "area", title: i => plain(i.title) || "New area", add: () => ({ title: "", role: "", text: "", photo: "" }), fields: [
      { k: "title", t: "rich", label: "Word", help: "One strong word. " + ITALIC },
      { k: "role", t: "text", label: "Small line" },

/* ---------------- email + password sign-in ----------------
   The site has no server, so the password can't be checked anywhere private.
   Instead the GitHub key is encrypted with the email + password (PBKDF2 → AES-GCM)
   and only that locked copy is stored, in admin/login.json. The password itself
   is never saved. A wrong email or password simply fails to unlock it. */
const TE = new TextEncoder();

  const base = await crypto.subtle.importKey("raw", TE.encode(email.trim().toLowerCase() + "\n" + password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);

  const key = await deriveKey(email, password, salt, iter);
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, TE.encode(JSON.stringify(secret))));
  return { v: 1, kdf: "PBKDF2-SHA256", iter, salt: bytesToB64(salt), iv: bytesToB64(iv), data: bytesToB64(data), updated: new Date().toISOString() };

  const key = await deriveKey(email, password, b64d(rec.salt), rec.iter || 600000);
  const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(rec.iv) }, key, b64d(rec.data));
  return JSON.parse(new TextDecoder().decode(out));
}

}

      toast("Published. The website updates in about a minute — refresh it to see your changes.");
      setTimeout(setStatus, 181000);
    } catch (e) {
      go.disabled = cancel.disabled = false; go.textContent = "Try again"; msg.hidden = false; msg.className = "err-box"; msg.textContent = explain(e); setStatus();
    }
  };
  go.onclick = () => run(false);
  d.onclose = null; d.showModal(); note.focus();
}

/* ---------------- live preview ---------------- */
function previewEl() {
  const frame = h("iframe", { class: "pv-frame", id: "pvFrame", title: "Preview of the website", src: SITE_PAGE + "?preview=frame" });
  const stage = h("div", { class: "pv-stage", id: "pvStage" }, frame);
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Preview size" },
    h("button", { "aria-pressed": "true", "data-dev": "desktop", onclick: () => setDevice("desktop") }, "Computer"),
    h("button", { "aria-pressed": "false", "data-dev": "phone", onclick: () => setDevice("phone") }, "Phone"));
  const el = h("section", { class: "pv", id: "pv", "aria-label": "Preview" },
    h("div", { class: "pv-bar" }, h("span", { class: "mono" }, "Preview · motion paused"), seg,
      h("button", { class: "b b--sm b--ghost", title: "Open a full-screen preview in a new tab", onclick: openFullPreview }, "↗"),
      h("button", { class: "b b--sm pv-close", onclick: () => $("#pv").classList.remove("overlay") }, "Close")),
    stage);
  new ResizeObserver(layoutPreview).observe(stage);
  return el;
}
function setDevice(dev) {
  S.device = dev;
  $$("#pv .seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dev === dev)));
  layoutPreview();
}
function layoutPreview() {
  const st = $("#pvStage"), fr = $("#pvFrame"); if (!st || !fr) return;
  const W = st.clientWidth, H = st.clientHeight; if (!W || !H) return;
  const phone = S.device === "phone", compact = phone && W < 520;
  st.classList.toggle("phone", phone && !compact);
  const vw = phone ? (compact ? W : 390) : 1280;
  const pad = phone && !compact ? 24 : 0;
  const scale = Math.min(1, (W - pad * 2) / vw);
  const fh = compact ? H : phone ? Math.min(844, (H - pad * 2) / scale) : H / scale;
  const left = phone ? (W - vw * scale) / 2 : 0;
  fr.style.width = vw + "px"; fr.style.height = fh + "px";
  fr.style.transform = `translate(${left}px,${pad}px) scale(${scale})`;
}
function postToPreview(msg) {
  const fr = $("#pvFrame"); if (!fr || !fr.contentWindow) return;
  try { fr.contentWindow.postMessage(msg, ORIGIN); } catch (e) {}
}
function sendPreview(jump) {
  if (!S.draft) return;
  postToPreview({ type: "av-content", content: S.draft, images: S.pending, jump: jump || null, rawBase: S.mode === "live" ? rawUrl("") : "" });
}
function openFullPreview() {
  store.set("av-preview-draft", S.draft); store.set("av-preview-images", S.pending);
  const a = h("a", { href: SITE_PAGE + "?preview=draft", target: "_blank", rel: "noopener" }); document.body.append(a); a.click(); a.remove();
}
addEventListener("message", e => {
  if (ORIGIN !== "*" && e.origin !== location.origin) return;
  if (e.data && e.data.type === "av-ready") { const sec = SECTIONS.find(s => s.id === S.section); sendPreview(sec && sec.anchor !== "top" ? sec.anchor : null); }
});

/* ---------------- boot ---------------- */
(async function boot() {
  const auth = store.get("av-editor-auth", true) || store.get("av-editor-auth");
  if (new URLSearchParams(location.search).has("demo")) {
    try { await loadDemo(); S.mode = "demo"; return startEditor(); } catch (e) { return drawSignin(explain(e), await fetchLogin()); }
  }
  if (auth && auth.token) {
    S.token = auth.token; S.owner = auth.owner || CONFIG.owner; S.repo = auth.repo || CONFIG.repo; S.branch = CONFIG.branch;
    try { await loadLive(); S.mode = "live"; return startEditor(); }
    catch (e) { store.del("av-editor-auth"); return drawSignin(e.status === 401 ? "You’ve been signed out because the GitHub key expired or was removed. Sign in again." : explain(e), await fetchLogin()); }
  }
  drawSignin("", await fetchLogin());
})();
</script>
